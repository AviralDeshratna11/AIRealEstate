[project]
name = "astra-estate-backend"
version = "0.1.0"
description = "FastAPI + LangGraph backend for ASTRA Estate"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "email-validator>=2.2.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "openai>=1.60.0",
  "langgraph>=0.2.60",
  "langchain-core>=0.3.0",
  "asyncpg>=0.29.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "numpy>=1.26.0",
  "scipy>=1.12.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.3.0",
  "pymupdf>=1.24.0",
  "google-auth>=2.30.0",
  "tzdata>=2024.1"
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0"]

[tool.ruff]
line-length = 100
